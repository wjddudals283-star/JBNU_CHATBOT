# 학사일정 항목 검색 사전.
#
# "수강신청 언제야" 같은 **특정 조회**를 처리한다.
# 목록 조회("마감 뭐 있어")는 이 사전에 안 걸리고 deadline.upcoming 으로 간다.
#
# ★ 유사도 매칭이 아니다.
#   utterance_aliases 는 학생이 쓰는 말, title_keywords 는 원천 제목에 실제로
#   들어 있는 말이다. 둘 다 **사람이 적은 목록**이고, 새 주제는 한 줄 추가한다.
#   부분일치를 자동으로 확장하지 않는다 — 그러면 엉뚱한 항목이 걸린다.
#
# ★ 긴 별칭 우선. '수강신청 변경'이 '수강신청'보다 먼저 걸려야 한다.

topics:
  수강신청변경:
    label: 수강신청 변경(정정)
    utterance_aliases: [수강신청변경, 수강변경, 수강정정, 정정기간, 수강신청 정정]
    title_keywords: [수강신청 변경]

  수강신청:
    label: 수강신청
    # ★ '신청기간' 같은 넓은 별칭을 넣으면 안 된다.
    #   '휴학 신청 기간'이 수강신청으로 잡힌다(테스트로 확인).
    #   별칭은 그 주제에만 쓰이는 말이어야 한다.
    utterance_aliases: [수강신청, 수강 신청, 수강신청기간]
    title_keywords: [수강신청]
    # ⚠️ 학사일정에는 '정식 수강신청'(8월)이 없다. 7월 본신청과 9월 변경만 있다.
    #   교내 공지에는 있으므로 답변에 공지 확인 안내를 함께 낸다. see_also 참고.
    see_also: 교내 공지

  개강:
    label: 개강
    utterance_aliases: [개강, 학기시작, 수업시작]
    title_keywords: [개강]

  종강:
    label: 종강
    utterance_aliases: [종강, 학기끝, 수업종료]
    title_keywords: [종강, 학기 종료]

  등록금:
    label: 등록금 납부
    # ★ '등록'(2글자)을 뺐다 (2026-08-18). '동아리 등록 기간'이 여기로 왔다.
    #   검색 블록의 시간 질문을 학사일정으로 넘기게 고친 순간 이 별칭이
    #   답을 가르는 자리가 됐고, 테스트가 바로 잡았다.
    #   '등록금'·'등록기간'이 이미 있어서 잃는 건 없다 —
    #   공지 제목 214건에 '등록'이 들어 있고 그중 94건(43.9%)은
    #   '등록금'도 '등록기간'도 아니다 (tools/alias_traps.py).
    #   '등록기간'도 뺐다 — 별칭 매칭은 공백을 지우고 보므로
    #   '동아리 등록 기간'이 '등록기간'에 그대로 걸린다.
    #   코퍼스 공지 제목에 '등록기간'은 **0건**이라 잃는 관측이 없다.
    utterance_aliases: [등록금, 납부]
    title_keywords: [등록]

  휴학:
    label: 휴학
    utterance_aliases: [휴학]
    title_keywords: [휴학]

  복학:
    label: 복학
    utterance_aliases: [복학]
    title_keywords: [복학]

  계절학기:
    label: 계절학기
    utterance_aliases: [계절학기, 계절수업, 특별학기]
    title_keywords: [계절수업, 특별학기]

  방학:
    label: 방학
    utterance_aliases: [방학, 휴가]
    title_keywords: [휴가]

  시험:
    label: 시험
    # ★ '시험' 을 넣는다 — 학생이 제일 많이 묻는 축인데 지금은 검색으로 샜다.
    #   그냥 넣으면 '종합시험'(공지 88건)·'외국어시험'(29건)이 걸려
    #   중간시험 완료로 답한다. find_topic 의 경계 규칙이 막는다 —
    #   앞 글자가 한글이면 다른 낱말의 일부로 본다.
    utterance_aliases: [중간고사, 기말고사, 시험기간, 중간시험, 기말시험, 시험]
    title_keywords: [중간시험, 기말시험]

  학위수여식:
    label: 학위수여식
    utterance_aliases: [학위수여식, 졸업식]
    title_keywords: [학위수여식]
