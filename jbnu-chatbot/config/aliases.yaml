# 별칭 사전 — 단일 진실 원천.
#
# 두 곳에서 쓴다.
#   1) 오픈빌더 엔티티 등록용 (tools/export_aliases.py 로 CSV 뽑기)
#   2) 스킬서버의 슬롯 보완 — params 가 비면 utterance 에서 별칭을 찾는다
#
# ★ 2번이 '자체 NLU'가 아닌 이유
#   인텐트(블록) 분류는 여전히 오픈빌더가 한다. 우리는 **이미 매칭된 블록 안에서**
#   슬롯을 채울 뿐이다. 오픈빌더는 발화마다 태깅해야 params 가 나오는데,
#   학생 자유 발화는 태깅이 안 되므로 params 가 계속 빈다.
#
# ★ 매칭 규칙: 긴 별칭 우선.
#   '의대식당'이 '의대'보다 먼저 걸려야 한다. 짧은 걸 먼저 보면
#   '의대식당 메뉴'에서 '의대'만 잡고 끝난다.

facility:
  "jbnu:facility/후생관-푸드코트":
    canonical: 후생관
    aliases: [후생관식당, 후생관, 푸드코트, 공대식당, 후생]
  "jbnu:facility/진수원":
    canonical: 진수원
    # '진수당'은 설계 문서의 오기였지만 학생도 그렇게 부를 수 있어 남긴다
    aliases: [진수원식당, 진수원, 진수당, 진수]
  "jbnu:facility/의대식당":
    canonical: 의대식당
    aliases: [의과대학식당, 의대식당, 의대]
  "jbnu:facility/생활관-식당":
    canonical: 생활관 식당
    aliases: [생활관식당, 기숙사식당, 생활관, 기숙사, 기숙사밥]

meal_type:
  breakfast:
    canonical: 아침
    aliases: [아침, 조식, 모닝]
  lunch:
    canonical: 점심
    aliases: [점심, 중식, 런치]
  dinner:
    canonical: 저녁
    aliases: [저녁, 석식, 디너]
