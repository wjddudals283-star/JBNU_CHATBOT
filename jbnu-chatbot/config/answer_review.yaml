# 46문항 검수 — **맞는 문서인가**를 사람이 확인한 결과.
#
# ★ 왜 사람이 보나 (2026-08-17)
#   '성적 이의신청' 이 **정보공개 이의신청(행정)** 문서로 통과하고 있었다.
#   학생이 물은 건 학사 이의신청이다. must('이의') 가 인용에 있어서 통과했다 —
#   자가 '문서를 찾았는가' 만 보고 '맞는 문서인가' 는 안 봤다.
#
#   ★ 문자열로는 못 가른다. 두 이의신청은 낱말이 겹치고 뜻이 다르다.
#     판정에 생성 모델을 쓰면 그 자를 검증할 자가 또 필요해진다 —
#     답변 경로에서 안 쓰는 이유가 판정에도 그대로 적용된다.
#
# ★ 채우는 법 — O/X 만 찍는다
#   1. python tools/review_sheet.py --db data/jbnu.db --out review.csv
#   2. 그 CSV 를 검수 시트에 붙여넣는다 (봇이 낸 문서가 미리 채워져 있다)
#   3. '검수 OX' 칸에 O/X 만 찍는다. X 인 것만 올바른 문서를 적는다
#   4. 결과를 아래 형식으로 옮긴다
#
# ★ 비어 있으면 **전부 '문서미확인'** 이다.
#   맞는 문서인지 모르는 걸 정답으로 세면 그게 거짓말이다.
#   지금 34건이 미확인이고, 그래서 점수가 38% → 13% 로 내려갔다.
#   내려간 게 아니라 **원래 그 상태였다.**

  # 예시 (채울 때 이 모양으로):
  # - question: 성적 이의신청
  #   ok: false
  #   expected: 전북대학교 본부 · 시험/성적
  #   note: 정보공개 이의신청(행정)이 나온다. 학사 이의신청이어야 한다
  # - question: 휴학 신청
  #   ok: true

# ★ must 를 낱말에서 **문서**로 옮긴다 (2026-08-30)
#   오늘 낱말로 세다 다섯 번 틀렸다 — 연혁·전임교수·시험·시점, 그리고 must.
#   한 번은 사고, 두 번은 부류, 세 번은 구조다.
#
#   expected      정답 문서가 있다 — 그 문서를 내야 통과한다
#   not_expected  정답이 코퍼스에 없다 — 그 문서만 안 내면 된다
#
#   ★ O/X 를 그대로 안 쓰고 **매번 다시 잰다.**
#     X 를 박아 두면 고쳐도 계속 빨간불이라 아무도 안 본다.
#     사람이 정하는 건 '정답 문서' 고, 지금 그걸 내는지는 자가 본다.
#
#   ★ 전면 교체가 아니다. 문서가 확정된 것부터 옮기고
#     나머지는 낱말 must 로 둔다. 시트가 채워지는 대로 옮긴다.

answers:
  # 대표 X · 코퍼스로 확인함 (2026-08-30)
  #   '이의신청' 이 든 문서 8종을 전수로 봤는데 **학사 성적 이의신청이 없다.**
  #   정보공개(행정) 이의신청만 있다. 정답이 코퍼스에 없으므로
  #   고칠 것은 '맞는 문서 찾기' 가 아니라 '이 문서를 확신 있게 안 내기' 다.
  - question: 성적 이의신청
    ok: false
    not_expected: 정보공개안내
    note: 학사 성적 이의신청 문서가 코퍼스에 없다 — 정보공개(행정)만 있다

  # 대표 X · 「원문은 참인데 답이 거짓」의 첫 사례
  #   역대총장 페이지는 한 줄도 안 틀렸다. 인용·출처 정확, must('총장') 있음.
  #   그런데 '총장 누구야' 에 1952년 김두헌을 보여주는 건 거짓말이다.
  #   현직은 총장인사말·총장프로필에 있다 ("전북대학교 총장 양오봉입니다").
  - question: 총장 누구야
    ok: false
    not_expected: 역대총장
    note: 원문은 참인데 답이 거짓 — 역대 목록은 '지금 누구' 의 답이 아니다
