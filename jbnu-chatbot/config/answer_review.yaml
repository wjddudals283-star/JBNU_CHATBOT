# 46문항 검수 — **맞는 문서인가**를 사람이 확인한 결과.
#
# ★ 왜 사람이 보나 (2026-08-17)
#   '성적 이의신청' 이 **정보공개 이의신청(행정)** 문서로 통과하고 있었다.
#   학생이 물은 건 학사 이의신청이다. must('이의') 가 인용에 있어서 통과했다 —
#   자가 '문서를 찾았는가' 만 보고 '맞는 문서인가' 는 안 봤다.
#
#   ★ 문자열로는 못 가른다. 두 이의신청은 낱말이 겹치고 뜻이 다르다.
#     판정에 생성 모델을 쓰면 그 자를 검증할 자가 또 필요해진다 —
#     답변 경로에서 안 쓰는 이유가 판정에도 그대로 적용된다.
#
# ★ 채우는 법 — O/X 만 찍는다
#   1. python tools/review_sheet.py --db data/jbnu.db --out review.csv
#   2. 그 CSV 를 검수 시트에 붙여넣는다 (봇이 낸 문서가 미리 채워져 있다)
#   3. '검수 OX' 칸에 O/X 만 찍는다. X 인 것만 올바른 문서를 적는다
#   4. 결과를 아래 형식으로 옮긴다
#
# ★ 비어 있으면 **전부 '문서미확인'** 이다.
#   맞는 문서인지 모르는 걸 정답으로 세면 그게 거짓말이다.
#   지금 34건이 미확인이고, 그래서 점수가 38% → 13% 로 내려갔다.
#   내려간 게 아니라 **원래 그 상태였다.**

