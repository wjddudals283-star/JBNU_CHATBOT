# 총학이 직접 확인해 넣는 답 (T4).
#
# ★ 왜 필요한가
#   홈페이지에 없는 것이 있다. 크롤로는 영영 못 채운다.
#   총학이 학사과·생활관에 전화해서 확인한 것만 여기에 넣는다.
#
# ★ 규칙 — 안전 연락처와 같다
#   1. 확인한 것만 넣는다. 들은 말·추측·"아마도" 는 넣지 않는다.
#   2. verified_by 는 **직책**으로 쓴다. 실명은 공개 저장소에 남기지 않는다.
#   3. valid_to 를 반드시 적는다. 학사 제도는 바뀐다.
#      지난 답은 자동으로 꺼진다 — 만료된 답을 계속 내보내는 것이 더 위험하다.
#   4. enabled: false 면 안 나간다. 확인 전에는 false 로 둔다.
#
# ★ 답변에는 출처가 붙는다
#   "총학생회가 학사과에 확인한 내용이에요 (2026-08-11 확인)"
#   홈페이지 링크가 없으므로 **어디에 물어 확인했는지**를 대신 밝힌다.
#   학생이 검증할 수 있어야 한다.
#
# ★ kind — 두 종류다
#   fact    : 있는데 홈페이지에 안 올라온 것 (예: 수강신청 정정기간)
#   absent  : **제도가 아예 없는 것** (예: 학점포기)
#
#   부재는 관측되지 않는다. 없는 제도는 페이지가 없고,
#   4,231페이지 어디에도 "학점포기는 없습니다" 라는 문장은 없다.
#   웹은 있는 것만 말한다. 그래서 이건 사람만 넣을 수 있다.
#
#   '없다' 의 갈래:  못 긁음 / 못 찾음 / 학교가 안 올림 / **제도가 아예 없음**
#   앞의 셋은 우리 사정이고 마지막 하나는 학교의 사실이다.
#   이걸 '모른다' 로 답하면 학생은 있는 줄 알고 계속 찾는다.
#
#   absent 에는 alternative 를 같이 쓴다. '없어요' 만 하면 답이 끝나지 않는다.
#
# ★ rule_check — 총학 답을 학칙·규정과 대조한 결과를 **기록만** 한다
#   대표 답을 검증 없이 정답으로 써 왔는데, 학칙이 그중 하나를 잡았다.
#       대표가 아는 것   규정에 없다      JUMP 전환 · 학점포기 없음
#       규정이 아는 것   대표가 헷갈린다   조기졸업 4.0 · 재이수 성적 상한
#   서로 못 보는 것을 본다.
#
#   ★ 학생에게는 안 드러낸다
#     "규정에 없어서 확실하지 않아요" 라고 하면 답이 쓸모없어진다.
#     우리가 알고 있고, 나중에 어긋나는 게 나오면 바로 찾을 수 있으면 된다.
#
#       규정에서 확인됨 / 규정에 없음 / ★ 규정과 어긋남

answers:
  - key: 학점포기
    kind: absent
    ask: [학점포기, 학점 포기, 학점포기제]
    answer: |
      전북대에는 학점포기 제도가 없어요.
    alternative: |
      이미 받은 성적을 지우는 방법은 없고, 재수강으로 성적을 다시 받을 수 있어요.
      재수강 규정은 '재수강'이라고 물어보시면 알려드릴게요.
    source: 총학생회 확인
    verified_by: 총학생회장
    verified_at: 2026-08-11
    valid_to: 2027-02-28
    enabled: true

  - key: 수강신청_정정기간
    kind: fact
    ask: [수강신청 정정, 정정기간, 수강정정]
    answer: |
      (확인 전 — 학사일정에 나오지 않는 해라면 학사과에 문의해 채우세요)
    source: 학사과 유선 확인
    verified_by: ""            # 예: 사무국장
    verified_at: ""            # 예: 2026-08-11
    valid_to: ""               # 예: 2027-02-28
    enabled: false

  - key: 재수강
    kind: fact
    ask: [재수강, 재이수, 재수강 규정, 재수강 제한, 재수강 성적]
    # ★ 규정은 '재수강' 이 아니라 **'재이수'** 라고 쓴다.
    #   학생 말('재수강')로 답하되 규정 용어를 같이 밝힌다 —
    #   학생이 원문에서 찾아 확인하려면 그 말이 있어야 한다.
    #   처음에 '재수강' 만 썼다가 측정에서 확신 오답 1건이 났다. 자가 잡아 줬다.
    answer: |
      전북대는 재수강(규정 용어로는 '재이수') 횟수 제한이 없어요.
      모든 교과목을 다시 들을 수 있습니다.
      다만 재이수한 과목의 성적은 **A0(4.0)까지**만 받을 수 있어요.
      이전 학점과 성적은 무효가 됩니다.
    source: 학사운영규정 제17조(수강 신청 및 학점) ④
    verified_by: 총학생회장
    verified_at: 2026-08-13
    valid_to: 2027-02-28
    # ★ 대조 결과 — 총학 답이 절반만 맞았다
    #   총학: "재수강 제한 없음"  → 횟수는 맞다
    #   규정: "재이수 과목의 성적은 A0 이하로 한다"  → 성적 상한이 있다
    #   학생이 "재수강하면 A+ 받을 수 있나요?" 라고 물으면
    #   "제한 없어요" 는 **틀린 답**이 된다.
    rule_check: 규정과 어긋남 (학사운영규정 제17조 ④ — 성적 상한 A0)
    enabled: true

  # ★ 「원문은 참인데 답이 거짓」을 T4 로 끊는다 (2026-10-07)
  #   8/30 에 역대총장 단정은 멈췄다(PAST_MARKERS). 그런데 **답을 안 줬다** —
  #   되묻기로 끝났고, 홍보하면 많이 물어볼 질문이다.
  #
  #   검색 순위로 고치려 했다가 되돌렸다. 로컬 코퍼스를 새로 긁는 중이라
  #   후보가 계속 바뀌었고(400→800페이지), 그 상태로 재면 자가 흔들린다.
  #   실제로 '총장 누구야' 가 수집 도중 '시험/성적'("상대평가는 총장이
  #   등급비를 정하는…")으로 확신 오답이 됐다. 순위는 D-1 에 건드릴 자리가 아니다.
  #
  #   ★ T4 는 사정거리가 0이다. 검색을 안 건드리고 route_of 에서 가장 먼저 걸린다.
  #   출처는 '총학생회 확인' 이 아니라 **원문 페이지**다 —
  #   홈페이지에 있는 것이므로 학생이 직접 검증할 수 있어야 한다.
  #   valid_to 는 학기 경계로 잡는다. 총장 임기는 바뀐다.
  - key: 총장
    kind: fact
    # ★ '총장' 단독은 넣지 않는다 — '역대총장' 을 먹는다.
    #   manual_answers.find 는 부분문자열로 찾고 **경계 규칙이 없다**
    #   (오늘 calendar_search 에 넣은 그 규칙이 여기엔 없다).
    #   '총장' 만 치면 검색이 되묻는다 — 그게 맞다.
    ask: [총장 누구야, 총장누구야, 총장이 누구야, 총장님 누구야, 총장 누구,
          총장 이름, 총장이름, 현 총장, 현총장, 지금 총장]
    answer: |
      전북대학교 총장은 양오봉 총장이에요.
    alternative: |
      총장 인사말과 프로필은 아래에서 볼 수 있어요.
      https://www.jbnu.ac.kr/web/intro/president/sub01.do
    source: 홈페이지(총장인사말)에서 확인
    verified_by: 총학생회장
    verified_at: 2026-10-07
    valid_to: 2027-02-28
    enabled: true
