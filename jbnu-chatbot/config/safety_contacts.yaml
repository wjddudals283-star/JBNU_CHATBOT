# D11 안전 분기 연락처·키워드.
#
# ★ 이 파일은 자동 갱신 대상이 아니다. 사람이 관리한다.
#
# ═══════════════════════════════════════════════════════════════
# 배포 차단 조건 (01_설계.md §7)
#
#   한 항목이 '확인됨'이 되려면 넷이 다 있어야 한다.
#       verified: true
#       verified_at:     YYYY-MM-DD   확인한 날짜
#       verified_by:     직책          확인한 사람 = 이 수준으로 가겠다고 결정한 책임 주체
#       verified_method: 확인 등급     official_site | phone
#
#   ★ verified_by 에는 **직책만** 쓴다. 이 저장소는 Public 이고,
#     한 번 커밋된 값은 지워도 히스토리에 남는다.
#
#   하나라도 빠지면 그 항목은 미확인이고, 미확인이 하나라도 있으면
#   **안전 분기 전체가 차단**된다(전부 아니면 전무). 그 상태에서는 상담 창구를
#   나열하지 않고 "총학에 직접 문의" 한 줄만 내보낸다.
#
#   verified: true 인데 나머지가 없으면 **예외를 던진다.** 조용히 강등하지 않는다 —
#   절반만 채운 항목은 누군가 확인을 시작했다가 멈춘 흔적이고,
#   그 상태로 배포되는 게 가장 위험하다.
#
# ─────────────────────────────────────────────────────────────
# 확인 등급 (verified_method)
#
#   official_site  각 기관 공식 홈페이지에서 확인. 현재 수준
#   phone          직접 전화해서 확인. 최고 등급
#
#   등급을 기록해 두면 나중에 누가 봐도 어느 수준의 확인인지 알 수 있고,
#   나중에 등급만 올리면 된다.
#
# ✅ 전북대 두 곳은 **전화로 확인했다** (2026-08-31, 총학생회장이 직접 걺).
#    번호·위치 모두 맞았다. verified_method: phone — 최고 등급이다.
#      · 전북대 행복드림센터  063-219-5301 (진수당 1층)
#      · 전북대 인권센터      063-270-3025
#
# ★ 왜 이 두 줄만 최고 등급인가 — **틀릴 때의 값이 다르다**
#   다른 답은 틀리면 학생이 헛걸음한다. 이건 틀리면
#   **위급한 학생이 안 받는 전화를 건다.**
#   틀릴 때의 값이 다르면 신뢰 등급도 달라야 한다.
#   그래서 크롤이 나중에 다른 번호를 물어와도 이 값이 이긴다 —
#   이 파일은 자동 갱신 대상이 아니다(맨 위 규칙).
#
# ★ recheck_at: 2027-02 (학기 바뀔 때)
#   센터는 이전·번호 변경이 잦다. 우리 서비스는 11/30 에 끝나지만
#   **이 값은 그 뒤에도 남는다.** 남는 값에는 만료를 적어 둔다.
#
#    국가인권위원회(1331)는 공식 사이트에서 확인되지 않아 **목록에서 뺐다.**
#    확인되면 harassment 에 다시 넣는다. 확인 안 된 번호를 남겨두면
#    안전 분기 전체가 차단되고, 급한 사람에게 목록을 못 준다.
# ═══════════════════════════════════════════════════════════════

unverified_fallback: |
  이 내용은 총학생회가 직접 도와드려야 하는 사안이에요.
  아래로 연락 주시면 담당자가 바로 안내해 드릴게요.

  전북대학교 총학생회 → (총학 연락처/채널 링크)

  지금 위험한 상황이면 112, 응급상황이면 119로 먼저 연락해 주세요.

priority: [emergency, violence, harassment, mental_health]

footer: "지금 위험한 상황이면 112, 응급상황이면 119로 먼저 연락해 주세요."

