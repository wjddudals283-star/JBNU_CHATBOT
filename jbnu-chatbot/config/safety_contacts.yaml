      지금 바로 이야기 나눌 수 있는 곳으로 연결해 드릴게요.
    contacts:
      # 109 는 2024년 1393 등 8개 상담전화가 통합된 번호다.
      # ★ 이런 배경 설명은 note 에 넣지 않는다 — note 는 답변에 그대로 나가고,
      #   위기 상황의 사용자에게 필요 없는 정보는 소음이다.
      #   note 는 '진수당 1층' 처럼 **찾아가는 데 필요한 것**만 쓴다.
      - label: "자살예방상담전화 (24시간)"
        phone: "109"
        verified: true
