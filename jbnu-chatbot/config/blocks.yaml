# 오픈빌더 블록 → 스킬 핸들러 매핑.
#
# 단일 진입점 POST /skill 이 이 파일로 분기한다.
# 블록을 추가할 때 오픈빌더에서 스킬을 새로 등록할 필요 없이,
# 여기 한 줄만 넣고 배포하면 된다.
#
# ★ 함정 — block.name 은 **총학이 오픈빌더에서 붙인 이름**이다.
#   'food.menu.today' 같은 우리 내부 키가 아니라 '오늘 학식' 같은 한국어일 수 있고,
#   나중에 이름을 바꾸면 라우팅이 끊긴다.
#   그래서 block.id(불변)를 우선하고, 이름은 보조로 쓴다.
#
# ★ 모르는 블록은 **추측해서 아무 핸들러로 보내지 않는다.**
#   키워드로 대충 맞히면 새 블록이 조용히 엉뚱한 답을 한다.
#   폴백을 내보내고 로그에 정확한 이름을 남긴다 → GET /admin/blocks 로 확인.

handlers:
  # 식단
  food.menu.today:
    - food.menu.today
    - food.menu
    - 오늘 학식
    - 학식
    - 식단
    - 오늘 메뉴
    - 학식 메뉴

  # 학사일정 · 마감
  deadline.upcoming:
    - deadline.upcoming
    - calendar.upcoming
    - calendar.date
    - 학사일정
    - 다가오는 일정
    - 마감
    - 수강신청 일정

  # 학교 안내 검색 — 페이지 본문을 그대로 인용한다
  info.search:
    - info.search
    - 안내
    - 학사 안내
    - 검색
    - 장학금
    - 휴학
    - 졸업요건

  # 공지 검색 — 제목·게시일·링크만. 본문은 읽지 않는다.
  notice.search:
    - notice.search
    - 공지
    - 공지사항
    - 모집
    - 게시판

# block.id → 핸들러. 이름을 바꿔도 안 끊긴다.
# 오픈빌더에서 블록을 만든 뒤 봇테스트 payload 의 userRequest.block.id 를 보고 채운다.
# 비어 있어도 이름 매핑으로 동작한다.
ids: {}
