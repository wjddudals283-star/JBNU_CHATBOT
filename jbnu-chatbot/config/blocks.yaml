# 오픈빌더 블록 → 스킬 핸들러 매핑.
#
# 단일 진입점 POST /skill 이 이 파일로 분기한다.
# 블록을 추가할 때 오픈빌더에서 스킬을 새로 등록할 필요 없이,
# 여기 한 줄만 넣고 배포하면 된다.
#
# ★ 함정 — block.name 은 **총학이 오픈빌더에서 붙인 이름**이다.
#   'food.menu.today' 같은 우리 내부 키가 아니라 '오늘 학식' 같은 한국어일 수 있고,
#   나중에 이름을 바꾸면 라우팅이 끊긴다.
#   그래서 block.id(불변)를 우선하고, 이름은 보조로 쓴다.
#
# ★ 모르는 블록은 **추측해서 아무 핸들러로 보내지 않는다.**
#   키워드로 대충 맞히면 새 블록이 조용히 엉뚱한 답을 한다.
#   폴백을 내보내고 로그에 정확한 이름을 남긴다 → GET /admin/blocks 로 확인.
#
# ★ 아래 별칭은 두 가지로 쓰인다
#   1. 블록 이름 매칭 (원래 용도)
#   2. **폴백으로 들어온 말의 갈래 정하기** — 카카오가 분류에 실패했을 때만.
#      '오늘 학식' 이 폴백으로 오면 안내 검색이 '오늘' 을 찾다가 실패한다.
#      낱말 목록을 따로 만들지 않고 여기를 쓴다 — 고칠 자리가 하나여야 한다.
#      가장 긴 별칭이 이긴다. 아무것도 안 걸리면 안내 검색이 기본이다.

handlers:
  # 식단
  food.menu.today:
    - food.menu.today
    - food.menu
    - 오늘 학식
    - 학식
    - 식단
    - 오늘 메뉴
    - 학식 메뉴
    - 급식
    - 학생식당
    # ★ 식단 답변의 버튼이 폴백으로 돌아올 때 식단으로 가야 한다.
    #   '후생관 내일 저녁' · '진수원 저녁' · '후생관 가격' 이 전부
    #   안내 검색으로 새고 있었다 — 우리가 붙인 버튼인데 아무도 안 눌러봤다.
    #   ★ '기숙사'·'생활관' 은 안 넣는다. '기숙사 통금' 이 식단으로 가 버린다.
    #     시설 이름 중 **음식 말고 다른 뜻이 없는 것**만 넣는다.
    - 후생관
    - 진수원
    - 의대식당
    - 생활관 식당

  # 학사일정 · 마감
  deadline.upcoming:
    - deadline.upcoming
    - calendar.upcoming
    - calendar.date
    - 학사일정
    - 다가오는 일정
    - 마감
    - 수강신청 일정

  # 학교 안내 검색 — 페이지 본문을 그대로 인용한다
  info.search:
    - info.search
    - 안내
    - 학사 안내
    - 검색
    - 장학금
    - 휴학
    - 졸업요건

  # 첫 인사. 무엇을 물을 수 있는지 보여주는 자리다.
  # ★ 정적 카드가 아니라 스킬로 간다 — 오픈빌더에서 저장이 두 번 실패했다
  #   ('기본 블록은 유일해야 합니다' / 저장 후 사라짐).
  #   폴백을 스킬데이터로 바꾼 경로가 안정적이었으므로 같은 방식으로 간다.
  #   그리고 버튼 문구를 코드에서 관리하면 답이 바뀔 때 같이 고칠 수 있다.
  welcome:
    - welcome
    - 웰컴 블록
    - 웰컴블록
    - 웰컴
    - 처음으로
    - 시작하기

  # 공지 검색 — 제목·게시일·링크만. 본문은 읽지 않는다.
  notice.search:
    - notice.search
    - 공지
    - 공지사항
    - 모집
    - 게시판

# ★ 폴백 블록 — 카카오 NLU 가 어느 블록도 못 고른 말이 여기로 온다.
#
#   이게 실은 가장 중요한 입구다. 오픈빌더 블록에 붙인 발화는 몇 개뿐이고
#   학생은 그 몇 개대로 말하지 않는다. '복학 신청' 하나만으로도 폴백으로 간다.
#   발화 목록을 상상으로 늘리는 대신, 못 잡은 말을 **전부 검색에 태운다.**
#   6,985페이지는 이 문이 열려야 쓰인다.
#
#   ★ 이름을 코드에 박지 않고 여기 후보로 둔다.
#     카카오가 폴백 블록에 붙이는 이름을 우리가 정하지 않는다. 맞히면 바로 되고,
#     틀리면 '모르는 블록' 취급으로 내려앉을 뿐 조용히 깨지지 않는다.
#     실제 이름은 GET /admin/blocks 의 unmapped 에 찍힌다 — 보고 한 줄 고치면 된다.
#     (점·공백·하이픈은 무시하고 비교한다)
fallback_blocks:
  - 폴백 블록
  - 폴백블록
  - fallback block
  - fallback

# block.id → 핸들러. 이름을 바꿔도 안 끊긴다.
# 오픈빌더에서 블록을 만든 뒤 봇테스트 payload 의 userRequest.block.id 를 보고 채운다.
# 비어 있어도 이름 매핑으로 동작한다.
ids: {}
