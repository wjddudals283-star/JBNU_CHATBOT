# CSS 셀렉터 — 코드에 박지 말 것 (02_핸드오프.md §7)
# 사이트가 개편되면 여기 한 줄만 고쳐서 복구한다.

likehome_week_menu:
  # 생활관 주간식단. 서버 렌더 HTML 테이블.
  table:        "table.calendar_box"
  header_cells: "thead tr th"
  body_rows:    "tbody tr"
  cell_link:    "a.calendar_pop"
  # 셀 안에서 품목을 나누는 태그
  item_separator_tag: "br"
  # 같은 데이터가 title 속성에 콤마 구분으로 한 번 더 들어 있다.
  # 독립 인코딩이므로 교차 검증에 쓴다 (불일치 → 격리).
  title_attr:      "title"
  title_separator: ","

  # 원천이 명시하는 미운영 표현. 이 문자열들이 menu_item.name 으로 저장되면
  # 챗봇이 "오늘 메뉴: 식사없음"이라고 답한다.
  closed_markers:
    - "식사없음"
    - "미운영"
    - "운영없음"
  # 대괄호로 감싼 값은 사유가 붙은 미운영으로 본다. 예: [지방선거] [대체공휴일]
  closed_bracket_pattern: "^\\[.+\\]$"

jbnu_cafeteria_day:
  # 학교 XHR (dataAjax.do type=day). 2차 원천 + 가격·운영시간.
  # 작업 순서 4번에서 사용.
  tables:            "table"
  hours_caption:     "점심 석식"
  price_caption:     "식당 메뉴 가격"
  menu_caption:      "식단"
  price_table_title: "후생관 메뉴 단가표"
  restaurant_heading: "h4, h5, strong"
