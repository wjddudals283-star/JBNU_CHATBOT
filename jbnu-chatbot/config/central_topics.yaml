# 학과 되묻기를 붙이면 **막다른 길**이 되는 주제 — 중앙 문서로 보낸다.
#
# ★ 왜 필요한가 (2026-08-17 실측)
#   '연계전공 졸업요건' 에 "'국어국문학과 연계전공 졸업요건'처럼 학과를 붙여서
#   물어봐 주세요" 가 나갔다. 그런데 연계전공은 **학과 소속이 아니다** —
#   학생이 뭘 붙여도 답에 못 닿는다. 되묻기가 막다른 길이 된다.
#
# ★ 근거는 관측이다
#   중앙 페이지 하나에 연계·융합전공 40개가 주관학과·전공이수학점·부전공이수학점·
#   적용연도까지 표로 있다 (page_section 73문단). 주관 정보는 거기에만 있다.
#   개별 홈페이지가 있는 건 40개 중 7개뿐이다.
#
# ★ 표를 인용하지는 않는다
#   그 표는 kind='table' 이라 헤더 경계가 없어 지금 규칙으로 못 그린다
#   (docs/what_we_can_answer.md — 파서를 고쳐야 한다).
#   못 그려도 **학생을 원문까지는 보낼 수 있다.** 막다른 길을 없애는 게 먼저다.
#   파서가 고쳐지면 이 답이 링크에서 표로 승격되면 된다.
#
# ★ 여기 적는 것은 '학과별로 안 갈리는 주제' 뿐이다.
#   교직·복수전공·부전공·교양은 실제로 학과별로 갈린다 (사이트 71~109곳). 안 넣는다.

