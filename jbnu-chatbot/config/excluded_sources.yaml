# 수집·인용에서 **통째로 빼는 원천**.
#
# ★ 왜 이 파일이 생겼나 (2026-10-07 D-0)
#   생활관 민원게시판이 코퍼스에 들어왔고 '기숙사 통금' 에 학생 실명이 나갔다.
#
#       7912 | 새빛관 | 생활관 2차 납부 | 접수 | 박수연 | 2026.10.05
#
#   요구사항 1순위가 '개인정보 제외' 다. 확신 오답보다 위다 —
#   틀린 답은 학생이 헛걸음하지만 이건 **다른 학생의 이름이 나간다.**
#
# ★ 모양으로 잡으려다 실패했다. 그 기록을 남긴다
#   처음엔 '작성자·등록일·조회수' 같은 칸 이름으로 게시판 목록을 판정했다.
#   **그 게시판을 본 적이 없는데 표지를 지어냈다.** 로컬 코퍼스에 없었고,
#   내가 본 칸 이름은 다른 게시판(연구뉴스·현장실습)의 것이었다.
#   실물에는 그 글자가 없어서 하나도 안 막혔다.
#
#   '로컬에 그 게시판이 없다' 는 **판정기를 만들 근거가 없다**는 뜻이었다.
#   만들어도 된다는 뜻이 아니었다.
#
# ★ 그래서 URL 로 막는다 — 모양 추측이 필요 없고 확실하다
#   확실한 한 건을 막는 것이 추측으로 넓게 거는 것보다 낫다.
#   모양 기반 판정기는 **서버 코퍼스를 실제로 보고** 개강 뒤에 만든다.
#
# ★ 두 곳에서 쓴다
#   1) 수집       crawler 가 애초에 안 긁는다 (앞으로)
#   2) 답변 경로   이미 들어온 잎을 인용 후보에서 뺀다 (지금 당장)
#   2번이 없으면 서버 DB 에 이미 있는 것이 계속 나간다.

