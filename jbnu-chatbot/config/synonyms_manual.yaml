# 사람이 이은 동의어 — **근거를 함께 적는다.**
#
# ★ 왜 파일이 따로 있나 (2026-10-12)
#   title_synonyms.yaml 은 tools/build_synonyms.py 가 **통째로 덮어쓴다**
#   (generated_at 이 박혀 있다). 거기에 손으로 넣으면 다음 재생성에 날아간다.
#   원칙의 충돌이 아니라 **덮어쓰기** 문제였다.
#
# ★ '관측으로 뽑는다' 는 **지어내지 말라**는 뜻이다
#   자동 추출만 쓰라는 뜻이 아니다. 그리고 자동 추출로는 이 짝을 영원히 못 찾는다 —
#   '통금' 은 코퍼스에 11잎뿐이고 전부 게시판 제목이다. 학교가 안 쓰는 말이다.
#
#       학교 말   귀관 시간 · 출입제한시간      코퍼스에 있다
#       학생 말   통금                      폴백 로그에만 있다
#
#   그래서 관측의 출처를 '코퍼스 안' 에서 **'코퍼스 ↔ 폴백 로그 대조'** 로 넓힌다.
#   양쪽 다 원문이고, 사람이 이은 것은 그 사실을 적어 둔다.
#   T4(총학이 확인한 답)와 같은 성격이다 — 사람이 이었지만 근거가 둘 다 원문이다.
#
# ★ 적을 것 — 나중에 '이건 어디서 왔나' 를 물을 수 있어야 한다
#     source   양쪽 근거. 학생 말은 어느 로그, 학교 말은 어느 원문
#     added    넣은 날
#   근거가 없으면 지어낸 것과 구별되지 않는다.

groups:
