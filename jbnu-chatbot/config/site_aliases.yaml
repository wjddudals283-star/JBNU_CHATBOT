# 사이트 별칭 — 학생이 쓰는 말 → 그 주제를 담당하는 사이트.
#
# ★ 왜 필요한가
#   사이트 이름은 학교가 정한 말이고, 질문은 학생이 쓰는 말이다.
#   '기숙사' 라고 묻는데 사이트 이름은 '생활관' 이라 글자가 하나도 안 겹친다.
#   그래서 본부 문서가 이기고, 정작 생활관 안내가 밀렸다.
#
# ★ 여기 넣는 것은 '같은 것을 가리키는 다른 이름' 뿐이다
#   비슷한 주제를 묶는 곳이 아니다. '장학금'을 아무 데나 연결하면
#   그건 별칭이 아니라 추측이 된다.
#
# ★ 총학이 직접 늘려도 되는 파일이다
#   학생이 실제로 쓰는 말은 우리가 제일 잘 안다. 코드를 고칠 필요 없다.

aliases:
