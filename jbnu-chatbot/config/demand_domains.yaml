# 학생 수요 도메인 — 커버리지·정확도를 이 축으로 쪼갠다.
#
# ★ 왜 필요한가
#   전체 커버리지 70.8% 는 평균일 뿐이다.
#   못 읽는 페이지가 수요 1위에 몰려 있으면 학생이 겪는 커버리지는 훨씬 낮다.
#   "전체 몇 %" 는 학생이 겪는 것을 말해주지 않는다.
#
# ★ weight 는 실제 수요 조사 결과다 (총학 설문)
#   62% 항목의 오답과 5% 항목의 오답을 같은 무게로 세면 안 된다.
#
# ★ keywords 는 페이지 제목·경로에 대한 것이다
#   완벽한 분류가 목적이 아니다. 어느 쪽에 구멍이 났는지 보는 것이 목적이다.
#   분류 못 한 것은 '미분류' 로 남긴다 — 억지로 채우면 그게 추측이 된다.

