disabled_why:
  졸업요건: '''졸업요건 ≡ 졸업자격인증제'' 가 잘못 묶였다. 졸업자격인증제는 영어·봉사 인증 제도로 졸업요건과 다른 것이다. 본문이 둘 다
    졸업·학점 얘기라 겹침 0.47 로 통과했다 — 관측 규칙이 못 가른 사례다. 이 묶음 때문에 ''졸업요건''(학과마다 다르니 되물어야 하는
    질문)에 본부 문서를 확신해서 답했다. 측정에서 확신 오답 1건으로 잡혔다.'
